<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Members - Fitness 8 Gym</title>
    <link rel="icon" href="images/favicon.png" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <nav id="nav" class="nav"></nav>
    <main class="container">
        <h1>Members</h1>
        <div id="pageMsg" class="msg" hidden></div>

        <section class="card">
            <h2 id="formTitle">Add member</h2>
            <form id="memberForm" novalidate>
                <div class="grid">
                    <div class="field" id="usernameField">
                        <label for="username">Username</label>
                        <input id="username" minlength="3" maxlength="50" autocomplete="off" />
                    </div>
                    <div class="field" id="passwordField">
                        <label for="password">Password</label>
                        <input id="password" type="password" minlength="6" maxlength="100" autocomplete="new-password" />
                    </div>
                    <div class="field">
                        <label for="fullName">Full name</label>
                        <input id="fullName" maxlength="100" />
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" type="email" maxlength="100" />
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input id="phone" maxlength="30" />
                    </div>
                    <div class="field">
                        <label for="plan">Membership plan</label>
                        <select id="plan">
                            <option value="">No plan</option>
                            <option>Monthly</option>
                            <option>Quarterly</option>
                            <option>Annual</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="expiry">Valid until</label>
                        <input id="expiry" type="date" />
                    </div>
                    <div class="field checkbox" id="activeField" hidden>
                        <input id="isActive" type="checkbox" checked />
                        <label for="isActive" style="margin:0">Active member</label>
                    </div>
                </div>
                <div class="row">
                    <button type="submit" id="saveBtn">Save member</button>
                    <button type="button" class="secondary" id="cancelBtn" hidden>Cancel edit</button>
                </div>
            </form>
        </section>

        <section class="card" id="detailCard" hidden>
            <h2>Member details</h2>
            <div id="detailBody"></div>
            <button type="button" class="secondary small" id="closeDetail">Close</button>
        </section>

        <section class="card">
            <h2>All members</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Name</th><th>Username</th><th>Plan</th><th>Valid until</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="membersBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
